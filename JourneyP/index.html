<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08101c">
  <title>Journey P｜角色狀態</title>
  <meta name="description" content="把每一天的任務與成長，化為一場看得見的冒險。">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap');
    :root{--gold:#c89a4b;--pale:#ead9b5;--panel:#171713}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--pale);font-family:'Noto Serif TC','Microsoft JhengHei',serif;background:radial-gradient(circle at 16% 45%,#2543446b,transparent 30%),radial-gradient(circle at 88% 30%,#22375c80,transparent 32%),linear-gradient(#07101e,#101815 57%,#080a09);padding:38px 18px}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(#ffffff26 1px,transparent 1px),linear-gradient(90deg,#ffffff18 1px,transparent 1px);background-size:4px 4px}
    .shell{max-width:1210px;margin:auto;border:4px solid #6f4b21;outline:2px solid #1a1108;padding:10px;border-radius:7px;box-shadow:0 0 0 2px #d3a34e,0 0 0 7px #25180b,0 22px 65px #000;background:#0b0c0be8}
    .inner{border:2px solid #76552e;padding:20px;background:linear-gradient(135deg,#191814f4,#0e100ff7)}
    .title-wrap{display:flex;justify-content:center;margin:-48px 0 22px}.title{min-width:420px;text-align:center;font-size:2.35rem;font-weight:900;letter-spacing:.22em;padding:10px 32px 14px;color:#f1e0b8;text-shadow:2px 3px #090704;border:3px solid #9d7131;outline:3px solid #15100a;background:linear-gradient(#243d6d,#16284b);box-shadow:inset 0 0 0 2px #cf9d42,0 7px 12px #000b}
    .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:26px}.profile{display:flex;gap:18px;align-items:center;padding-bottom:15px;border-bottom:2px dotted #5a492e}.portrait{width:70px;height:70px;border:3px solid #c8943d;box-shadow:0 0 0 4px #18130d;background:#243149;display:grid;place-items:center;font-size:34px}.name{font-size:2rem;font-weight:900;color:#f0dfbd;line-height:1.2}.mood{color:#c7b389;margin-top:6px}
    .stage{position:relative;margin-top:18px;height:470px;overflow:hidden;border:1px solid #443821;background:#080b0d;box-shadow:inset 0 0 32px #000}.stage img{width:100%;height:100%;object-fit:cover;object-position:center 44%;image-rendering:pixelated;opacity:.96}.slot{position:absolute;width:66px;height:66px;display:grid;place-items:center;font-size:32px;background:#11120fe8;border:2px solid #746246;box-shadow:inset 0 0 0 3px #080907,0 3px 8px #000;transition:.18s}.slot:hover{transform:translateY(-2px);border-color:#e2b45d}.s1{left:14px;top:18px}.s2{left:14px;top:100px}.s3{left:14px;top:182px}.s4{right:14px;top:18px}.s5{right:14px;top:100px}.s6{right:14px;top:182px}
    .xp-card{display:grid;grid-template-columns:105px 1fr;margin-top:16px;border:2px solid #76552e;background:#11120f}.level{padding:13px;text-align:center;background:linear-gradient(#17305a,#101b34);border-right:2px solid #ba8437;font-weight:900;color:#f3ce6b}.level small{display:block}.level strong{font-size:2.2rem}.xp{padding:12px 16px}.xp-row{display:flex;justify-content:space-between;color:#ded0b3}.bar{height:14px;background:#090a09;border:2px solid #71634d;margin:7px 0 10px;box-shadow:inset 0 0 5px #000}.fill{height:100%;background:linear-gradient(#8fd45d,#397f32);width:52%}.tag{border:1px solid #52442e;padding:7px 12px;color:#e8d4a6}
    .section-title{display:flex;align-items:center;gap:13px;color:#d8bf8b;font-size:1.2rem;letter-spacing:.15em;margin:5px 0 14px}.section-title:before,.section-title:after{content:"";height:2px;flex:1;background:linear-gradient(90deg,transparent,#705d3a,transparent)}.vital{margin-bottom:15px;padding:14px 16px;border:2px solid #7b572e;background:#10100ef2;box-shadow:inset 0 0 0 2px #22170c}.vital-top{display:flex;align-items:center;gap:12px;font-size:1.45rem;font-weight:900}.num{margin-left:auto;font-variant-numeric:tabular-nums}.red{color:#ff6d76}.blue{color:#5da8ff}.yellow{color:#f9d44f}.meter{height:18px;margin-top:10px;background:#070909;border:2px solid #9a7138;border-radius:3px;padding:2px}.meter span{display:block;height:100%}.hp{width:60%;background:linear-gradient(#fa5262,#b31d35)}.mp{width:56%;background:linear-gradient(#3a9eff,#1764c4)}.sp{width:38%;background:linear-gradient(#ffe86a,#c29b23)}
    .stats{display:grid;grid-template-columns:1fr 1fr;border:2px solid #4f432f;background:#11120f}.stat{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px dotted #50452f}.stat:nth-child(odd){border-right:1px solid #50452f}.stat b{color:#f0e2c5}.stat span{color:#d7c8aa;font-weight:700}.quest{margin-top:16px;border:2px solid #74552f;padding:15px;background:linear-gradient(90deg,#1b1710,#11130f)}.quest-head{display:flex;justify-content:space-between;color:#f0d18e;font-weight:900}.quest p{margin:8px 0 0;color:#bcae92}.quest-progress{height:8px;background:#080908;margin-top:10px}.quest-progress span{display:block;width:62%;height:100%;background:#cf9e45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.btn{cursor:pointer;border:2px solid #8e6935;background:linear-gradient(#252017,#11120f);color:#ead8b2;padding:11px;font:700 1rem inherit;box-shadow:inset 0 0 0 2px #0a0907}.btn:hover{border-color:#ddb465;color:#fff1c9}.footer{text-align:center;color:#8f8066;margin:16px 0 0;font-size:.85rem;letter-spacing:.08em}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);padding:11px 20px;background:#15130f;border:2px solid #c49343;color:#f2dfb4;opacity:0;pointer-events:none;transition:.25s;z-index:4}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:820px){body{padding:32px 10px}.title{min-width:0;width:82%;font-size:1.55rem}.grid{grid-template-columns:1fr}.stage{height:420px}.inner{padding:12px}.stats{grid-template-columns:1fr}.stat:nth-child(odd){border-right:0}.right{padding-top:8px}}
  </style>
</head>
<body>
  <main class="shell"><div class="inner"><div class="title-wrap"><div class="title">角色狀態</div></div>
    <div class="grid">
      <section><div class="profile"><div class="portrait">🧑🏻‍🦱</div><div><div class="name">亞 倫</div><div class="mood">有點累，但還是會繼續冒險。</div></div></div>
        <div class="stage"><img src="static/traveler.png" alt="披著深藍斗篷、手持長劍的像素風旅人"><span class="slot s1" title="武器">🗡️</span><span class="slot s2" title="守護">🛡️</span><span class="slot s3" title="專注披風">🧥</span><span class="slot s4" title="信念護符">🔮</span><span class="slot s5" title="習慣指環">💍</span><span class="slot s6" title="旅者靴">🥾</span></div>
        <div class="xp-card"><div class="level"><small>旅程等級</small><strong>18</strong></div><div class="xp"><div class="xp-row"><b>本週成長</b><span>2,360 / 4,500</span></div><div class="bar"><div class="fill"></div></div><div class="tag">★ 見習冒險者 · 穩定前進中</div></div></div>
      </section>
      <section class="right"><div class="section-title">✦ 今日能量 ✦</div>
        <div class="vital"><div class="vital-top"><span>❤️</span><span>體力</span><span class="num red">72 / 120</span></div><div class="meter"><span class="hp"></span></div></div>
        <div class="vital"><div class="vital-top"><span>💧</span><span>專注</span><span class="num blue">56 / 100</span></div><div class="meter"><span class="mp"></span></div></div>
        <div class="vital"><div class="vital-top"><span>⚡</span><span>心力</span><span class="num yellow">38 / 100</span></div><div class="meter"><span class="sp"></span></div></div>
        <div class="section-title">✦ 成長屬性 ✦</div><div class="stats"><div class="stat"><b>⚔️ 行動力</b><span>56</span></div><div class="stat"><b>🥾 自律</b><span>34</span></div><div class="stat"><b>🛡️ 韌性</b><span>42</span></div><div class="stat"><b>❤️ 健康</b><span>52</span></div><div class="stat"><b>🎯 專注</b><span>92%</span></div><div class="stat"><b>💧 知識</b><span>28</span></div><div class="stat"><b>✨ 創造力</b><span>18</span></div><div class="stat"><b>🍀 幸運</b><span>15</span></div></div>
        <div class="quest"><div class="quest-head"><span>主線任務｜打造 Journey P</span><span>62%</span></div><p>下一步：完成角色介面，定義成長屬性。</p><div class="quest-progress"><span></span></div></div>
        <div class="actions"><button class="btn">📜 查看今日任務</button><button class="btn">🧭 繼續旅程</button></div>
      </section>
    </div><div class="footer">JOURNEY P · EVERY DAY IS PART OF THE ADVENTURE</div>
  </div></main><div class="toast" role="status">此功能會在下一個版本開放 ✦</div>
  <script>const t=document.querySelector('.toast');document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>{t.classList.add('show');clearTimeout(window.jpt);window.jpt=setTimeout(()=>t.classList.remove('show'),1800)}));</script>
</body>
</html>
